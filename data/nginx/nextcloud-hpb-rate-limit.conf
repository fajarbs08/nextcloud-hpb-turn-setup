# Rate limiting (safe defaults for HPB signaling)
limit_req_status 429;
limit_conn_status 429;

# Per-IP request rate (lenient defaults)
limit_req_zone $binary_remote_addr zone=hpb_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hpb_ws:10m rate=60r/s;

# Per-IP concurrent connections
limit_conn_zone $binary_remote_addr zone=hpb_conn:10m;
