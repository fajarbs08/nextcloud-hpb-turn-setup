# Nextcloud HPB - Nginx tuning (moderate spec)
# Applied inside http{} via /etc/nginx/conf.d.
# Note: common defaults like sendfile/tcp_nopush/keepalive/gzip are already
# set in Debian's nginx.conf; avoid duplicates here.

client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;
reset_timedout_connection on;

# Reduce request buffering for long-lived connections.
proxy_request_buffering off;
