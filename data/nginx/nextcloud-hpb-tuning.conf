# Nextcloud HPB - Nginx tuning (moderate spec)
# Applied inside http{} via /etc/nginx/conf.d.
# Note: worker_processes/worker_connections must be set in /etc/nginx/nginx.conf.

sendfile on;
tcp_nopush on;
tcp_nodelay on;

keepalive_timeout 65;
keepalive_requests 1000;

types_hash_max_size 2048;

client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;
reset_timedout_connection on;

# Avoid gzip for signaling/WebSocket traffic.
gzip off;

# Reduce request buffering for long-lived connections.
proxy_request_buffering off;
